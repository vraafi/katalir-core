# Dihasilkan otomatis oleh apisguru_generator.py (TASK 3).
# Sumber: APIs.guru openapi-directory.
# verification.level = 'listed': BELUM dijalankan. Tingkat 'callable'/
# 'call_verified' hanya diberikan harness setelah panggilan nyata.
manifest_version: 1
id: apisguru.adafruit_com
slug: apisguru_adafruit_com
display_name: Adafruit IO REST API (APIs.guru)
description: 'Connector dihasilkan otomatis dari spesifikasi OpenAPI publik Adafruit IO REST API v2.0.0.
  Sumber: APIs.guru openapi-directory.'
category: apisguru
source: apisguru
tenant_scope: per-user
deprecated: false
minimum_supported_release: 1.0.0
credential_free: false
auth:
  type: api_key
  credential_form: api_key_header
  key_name: api_key
actions:
- name: currentuser
  description: Get information about the current user
  operation_type: read
  method: GET
  url_base: https://io.adafruit.com/api/v2
  path: /user
  record_selector:
    type: DpathExtractor
    field_path:
    - '*'
  paginator: NoPagination
  error_handler:
    type: DefaultErrorHandler
    retry:
      type: ExponentialBackoffStrategy
      max_retries: 3
  verification:
    level: listed
- name: createwebhookfeeddata
  description: Send data to a feed via webhook URL.
  operation_type: write
  method: POST
  url_base: https://io.adafruit.com/api/v2
  path: /webhooks/feed/:token
  record_selector:
    type: DpathExtractor
    field_path:
    - '*'
  paginator: NoPagination
  error_handler:
    type: DefaultErrorHandler
    retry:
      type: ExponentialBackoffStrategy
      max_retries: 3
  verification:
    level: listed
  request_body_json:
    value: ''
rate_limit:
  type: FixedWindowCallRatePolicy
  max_calls: 60
  window_seconds: 60
