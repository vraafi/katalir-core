# connectors/_template/connector.yaml
# ---------------------------------------------------------------------------
# TEMPLATE manifest connector Katalir (manifest_version 1).
#
# Cara pakai: salin file ini ke connectors/<source>/<slug>.yaml lalu isi.
# Validasi:
#   python -c "import connector_harness as h; print(h.run_harness(open('connectors/native/x.yaml',encoding='utf-8').read()).to_dict())"
#
# Kosakata bersifat TERTUTUP — nilai di luar daftar ini ditolak validator.
# Skema lengkap: connector_manifest.describe(); uji: connector_harness.describe().
#
# JANGAN menulis kredensial apa pun di file ini. Manifest di-commit; token
# di dalamnya adalah kebocoran. scan_secrets() memblokir pola yang dikenal,
# tetapi itu jaring pengaman, bukan izin.
#
# Catatan YAML: `key: value   # komentar` AMAN. Tetapi `key: value\t# komentar`
# (dengan tab) akan membuat '# komentar' menjadi bagian nilai — pakai spasi.
#
# Contoh connector yang 10/10 PASS: connectors/native/restcountries_lookup.yaml.
# ---------------------------------------------------------------------------

manifest_version: 1

# id: namespaced, huruf kecil, titik sebagai pemisah. Wajib unik lintas katalog.
id: example.service.action

# slug: huruf kecil/angka/_/-, maks 64. Dipakai untuk nama file + URL.
slug: example_service_action

display_name: "Example — Nama Manusiawi"
description: "Satu kalimat: apa yang dilakukan connector ini."
category: developer-tools
source: native

# tenant_scope: per-user (menyentuh data pelanggan, butuh kredensial user)
#            | public  (data publik, boleh jalan tanpa kredensial user)
tenant_scope: per-user

deprecated: false
minimum_supported_release: "1.0.0"

# credential_free: true HANYA bila connector bisa dijalankan tanpa rahasia user.
# Ini yang mengizinkan status call_verified — lihat catatan di bagian verification.
credential_free: false

auth:
  # none | api_key | bearer | basic | oauth2 | jwt | session_token | selective
  type: bearer
  # Menunjuk ke credential_forms.py — manifest tidak menyimpan rahasia.
  credential_form: example_token
  connect_url: null
  scopes: []

actions:
  - name: get_thing
    description: "Ambil satu objek."
    # read | write | delete — dipakai tool_policy_gate untuk mengizinkan/menolak.
    operation_type: read
    method: GET
    # Ganti dengan host nyata. Host contoh (example.com) DAN host loopback
    # diblokir oleh test keamanan.
    url_base: https://api.your-service.example
    path: /v1/things/{{ config.thing_id }}
    # Kosakata komponen Airbyte:
    record_selector:
      type: DpathExtractor
      field_path: ["data"]
    paginator: NoPagination
    # WAJIB: setiap action butuh error_handler + retry (test 8).
    error_handler:
      type: DefaultErrorHandler
      retry:
        type: ExponentialBackoffStrategy
        max_retries: 3
    verification:
      # listed | callable | call_verified
      # call_verified hanya dipromosikan bila credential_free: true DAN
      # harness benar-benar memanggil endpoint. Kalau tidak, tetap callable.
      level: callable

  - name: create_thing
    description: "Buat satu objek."
    operation_type: write
    method: POST
    url_base: https://api.your-service.example
    path: /v1/things
    request_body_json:
      title: "{{ input.title }}"
      note: "{{ input.note | default('') }}"
    error_handler:
      type: DefaultErrorHandler
      retry:
        type: ConstantBackoffStrategy
        max_retries: 2
    verification:
      level: listed

# triggers: OPSIONAL. Hapus seluruh blok bila connector hanya pull.
triggers:
  - name: thing_created
    type: webhook
    signature: hmac_sha256
    header: X-Example-Signature

rate_limit:
  # FixedWindowCallRatePolicy | MovingWindowCallRatePolicy | UnlimitedCallRatePolicy
  type: FixedWindowCallRatePolicy
  max_calls: 600
  window_seconds: 3600
