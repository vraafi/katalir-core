[pytest]
# ---------------------------------------------------------------------------
# Batas suite proyek.
#
# MASALAH NYATA (terukur): `pytest` TANPA argumen dari root tidak pernah
# selesai (>1 jam). Penyebabnya bukan satu tes yang menggantung, melainkan
# apa yang IKUT TERSAPU:
#
#   1. Skrip harness ad-hoc berpola `*_test.py` (mis. `_prod_hard_test.py`).
#      pytest memakai pola default `test_*.py` DAN `*_test.py`, jadi berkas
#      itu diimpor sebagai modul tes. Isinya BUKAN definisi tes melainkan
#      program: ia menjalankan load test 850 request konkuren, 30 vektor
#      adversarial, dan workflow 60 node melawan backend produksi —
#      semuanya pada saat impor. Collection karena itu tidak pernah usai.
#      Bukti: `python -c "import _prod_hard_test"` timeout 25 s tanpa output;
#      `pytest _prod_hard_test.py --co -q` timeout 40 s tanpa output.
#
#   2. Kode vendored pihak ketiga: `_vdbos/greenlet/tests` (15 berkas) dan
#      `_vdbos/sqlalchemy/testing/suite` (13 berkas) — 15 error saat koleksi.
#
# Keduanya BUKAN tes proyek ini. `testpaths` membuat `pytest` polos hanya
# menyentuh suite yang memang milik proyek.
#
# Suite utama = 1273 tes (koleksi 8 s).
# Tes di root (test_*.py) butuh jaringan/kredensial (Playwright, Supabase,
# Gemini) sehingga TIDAK ikut default; jalankan eksplisit bila perlu:
#     pytest test_security_jwt.py
# ---------------------------------------------------------------------------
testpaths = tests

# Sabuk pengaman untuk `pytest .`: jangan pernah menyusuri kode vendored,
# skrip harness, atau dependensi.
norecursedirs = .* _* node_modules __pycache__ .git build dist *.egg-info .venv venv gacha-purgatory

# Hanya `test_*.py` — pola `*_test.py` sengaja TIDAK dipakai karena di repo
# ini pola itu dipakai skrip harness produksi, bukan modul tes.
python_files = test_*.py

# Timeout per tes tidak dipasang di sini: `pytest-timeout` bukan dependensi
# proyek. Bila suite kembali menggantung, pasang dulu lalu tambahkan
# `--timeout=120` supaya tes yang macet dilaporkan, bukan menggantung senyap.
