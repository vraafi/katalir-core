<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katalir — Secrets Manager</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2b303b;
    --fg:#e8ecf3; --muted:#98a2b3; --accent:#5b8cff; --ok:#22c55e;
    --warn:#f59e0b; --bad:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;
         background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
  .badge{font-size:11px;padding:3px 9px;border-radius:999px;
         background:rgba(91,140,255,.15);color:var(--accent);
         border:1px solid rgba(91,140,255,.35)}
  .spacer{flex:1}
  main{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:1000px){main{grid-template-columns:1fr}}
  section{background:var(--panel);border:1px solid var(--line);border-radius:12px;
          padding:14px 16px}
  section h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;
             letter-spacing:.7px;color:var(--muted);font-weight:650}
  label{display:block;font-size:11.5px;color:var(--muted);margin:8px 0 3px;
        text-transform:uppercase;letter-spacing:.5px}
  input,textarea,select{width:100%;font:inherit;font-size:13px;padding:7px 9px;
                 border-radius:8px;border:1px solid var(--line);
                 background:var(--panel2);color:var(--fg)}
  textarea{min-height:80px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
  button{font:inherit;font-size:12.5px;padding:7px 12px;border-radius:8px;
         border:1px solid var(--line);background:var(--panel2);color:var(--fg);
         cursor:pointer;margin:10px 6px 0 0}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;
        margin:2px 4px 2px 0;border:1px solid var(--line);background:var(--panel2)}
  .chip.on{border-color:rgba(34,197,94,.45);color:var(--ok)}
  .chip.off{border-color:rgba(239,68,68,.35);color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;
     letter-spacing:.5px}
  pre{margin:8px 0 0;background:#0b0d11;border:1px solid var(--line);
      border-radius:8px;padding:10px;font-size:11.5px;max-height:300px;
      overflow:auto;white-space:pre-wrap;word-break:break-word}
  .muted{color:var(--muted);font-size:12.5px}
  .toast{position:fixed;right:18px;bottom:18px;background:var(--panel2);
         border:1px solid var(--line);border-left:3px solid var(--accent);
         padding:10px 14px;border-radius:10px;font-size:13px;max-width:460px;
         display:none}
</style>
</head>
<body>
<header>
  <h1>Katalir · Secrets Manager</h1>
  <span class="badge" id="default">default: —</span>
  <span class="spacer"></span>
  <span class="muted" id="ts">—</span>
</header>

<main>
  <section>
    <h2>Provider aktif</h2>
    <div id="chips" class="row"><span class="muted">memuat…</span></div>
    <table id="tbl" style="margin-top:10px">
      <thead><tr><th>Provider</th><th>Versi / Endpoint</th><th>Status</th></tr></thead>
      <tbody><tr><td colspan="3" class="muted">memuat…</td></tr></tbody>
    </table>
    <div class="row">
      <button class="primary" onclick="muat()">Muat ulang</button>
      <button onclick="info()">Uji koneksi provider</button>
    </div>
    <pre id="raw">—</pre>
  </section>

  <section>
    <h2>Resolve referensi</h2>
    <label for="ref">Referensi <code>secret://</code></label>
    <input id="ref" value="secret://openbao/demo/db"
           placeholder="secret://hashicorp/app/key">
    <div class="row">
      <label style="margin:0"><input type="checkbox" id="reveal" style="width:auto">
        tampilkan nilai (reveal)</label>
    </div>
    <label for="chain">Rantai failover (opsional, dipisah koma)</label>
    <input id="chain" placeholder="hashicorp,openbao,aws">
    <div class="row">
      <button class="primary" onclick="resolve()">Resolve</button>
      <button onclick="history()">Riwayat rotasi</button>
    </div>

    <h2 style="margin-top:16px">Rotasi rahasia</h2>
    <label for="rotpath">Path / referensi</label>
    <input id="rotpath" value="secret://openbao/demo/db">
    <label for="rotval">Nilai baru (tidak pernah dicatat)</label>
    <input id="rotval" type="password" placeholder="••••••••">
    <div class="row">
      <button class="primary" onclick="rotate()">Rotasi</button>
    </div>
    <pre id="out">—</pre>
  </section>

  <section style="grid-column:1/-1">
    <h2>Dokumentasi format &amp; batas</h2>
    <div id="formats" class="muted">memuat…</div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
if (q.get('token')) { try { localStorage.setItem('katalir_token', q.get('token')); } catch(e){} }
function token(){ try { return localStorage.getItem('katalir_token') || ''; } catch(e) { return ''; } }
function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', 4200); }
async function api(path, opts){
  const h = {'Accept':'application/json'};
  const tk = token(); if (tk) h['Authorization'] = 'Bearer ' + tk;
  if (opts && opts.body) h['Content-Type'] = 'application/json';
  const r = await fetch(path, Object.assign({}, opts, {headers:h}));
  const t = await r.text();
  let j; try { j = JSON.parse(t); } catch(e){ j = {raw:t}; }
  return {status:r.status, body:j};
}
function stamp(){ $('ts').textContent = new Date().toLocaleTimeString('id-ID'); }

async function muat(){
  const r = await api('/secrets/backends');
  $('default').textContent = 'default: ' + (r.body.default || '—');
  const b = r.body.backends || [];
  $('chips').innerHTML = b.map(x =>
    `<span class="chip ${x.available?'on':'off'}">${x.backend} · ${x.available?'aktif':'mati'}</span>`
  ).join('');
  $('raw').textContent = JSON.stringify(r.body, null, 1);
  stamp();
  const f = await api('/secrets/formats');
  $('formats').innerHTML = 'maks ' + f.body.max_bytes + ' byte · ' +
    (f.body.formats||[]).map(x=>`<span class="chip">${x.contoh}</span>`).join('');
}

async function info(){
  const r = await api('/secrets/info');
  const p = r.body.providers || {};
  $('tbl').querySelector('tbody').innerHTML = Object.entries(p).map(([k,v])=>{
    const vv = v.version || v.endpoint || (v.secret_count!==undefined ? ('secrets: '+v.secret_count) : '—');
    const ok = v.available && !v.sealed;
    return `<tr><td>${k}</td><td>${vv}</td>
      <td class="${ok?'':'muted'}">${v.available?(v.sealed?'sealed':'aktif'):'mati'}</td></tr>`;
  }).join('');
  $('raw').textContent = JSON.stringify(r.body, null, 1);
  toast('Koneksi provider diuji'); stamp();
}

async function resolve(){
  const body = {ref:$('ref').value, reveal:$('reveal').checked};
  const c = $('chain').value.trim();
  if (c) body.chain = c.split(',').map(s=>s.trim()).filter(Boolean);
  const r = await api('/secrets/resolve', {method:'POST', body:JSON.stringify(body)});
  $('out').textContent = JSON.stringify(r.body, null, 1);
  toast(r.status===200 ? 'Resolve OK' : 'Gagal: '+r.status); stamp();
}

async function rotate(){
  const r = await api('/secrets/rotate', {method:'POST',
    body:JSON.stringify({ref:$('rotpath').value, value:$('rotval').value})});
  $('rotval').value = '';
  $('out').textContent = JSON.stringify(r.body, null, 1);
  toast(r.status===200 ? 'Rotasi OK (versi '+r.body.rotation.version+')' : 'Gagal: '+r.status);
  stamp();
}

async function history(){
  const r = await api('/secrets/history?ref=' + encodeURIComponent($('ref').value));
  $('out').textContent = JSON.stringify(r.body, null, 1); stamp();
}

muat(); info();
</script>
</body>
</html>
