# render.yaml - Render Blueprint para backend FastAPI (Nexus Agent API)
services:
  - type: web
    name: nexus-agent-api
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: "uvicorn api_server:app --host 0.0.0.0 --port ${PORT:-8000}"
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: PERSIST_REQUIRED
        value: "1"