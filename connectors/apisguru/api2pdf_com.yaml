manifest_version: 1
id: apisguru.api2pdf_com
slug: apisguru_api2pdf_com
display_name: Api2Pdf - PDF Generation, Powered by AWS Lambda (APIs.guru)
description: 'Connector dihasilkan otomatis dari spesifikasi OpenAPI publik Api2Pdf - PDF Generation,
  Powered by AWS Lambda v1.0.0. Sumber: APIs.guru openapi-directory.'
category: apisguru
source: apisguru
tenant_scope: per-user
deprecated: false
minimum_supported_release: 1.0.0
credential_free: false
auth:
  type: api_key
  credential_form: api_key_header
  key_name: authorization
actions:
- name: chromefromurlget
  description: Convert URL to PDF
  operation_type: read
  method: GET
  url_base: https://v2018.api2pdf.com
  path: /chrome/url
  record_selector:
    type: DpathExtractor
    field_path:
    - '*'
  paginator: NoPagination
  error_handler:
    type: DefaultErrorHandler
    retry:
      type: ExponentialBackoffStrategy
      max_retries: 3
  verification:
    level: listed
- name: wkhtmltopdffromurlget
  description: Convert URL to PDF
  operation_type: read
  method: GET
  url_base: https://v2018.api2pdf.com
  path: /wkhtmltopdf/url
  record_selector:
    type: DpathExtractor
    field_path:
    - '*'
  paginator: NoPagination
  error_handler:
    type: DefaultErrorHandler
    retry:
      type: ExponentialBackoffStrategy
      max_retries: 3
  verification:
    level: listed
- name: zebraget
  description: Generate bar codes and QR codes with ZXING.
  operation_type: read
  method: GET
  url_base: https://v2018.api2pdf.com
  path: /zebra
  record_selector:
    type: DpathExtractor
    field_path:
    - '*'
  paginator: NoPagination
  error_handler:
    type: DefaultErrorHandler
    retry:
      type: ExponentialBackoffStrategy
      max_retries: 3
  verification:
    level: listed
rate_limit:
  type: FixedWindowCallRatePolicy
  max_calls: 60
  window_seconds: 60
