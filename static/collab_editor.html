<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katalir — Kolaborasi Real-Time (Yjs)</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2b303b;
        --fg:#e8ecf3;--muted:#98a2b3;--accent:#5b8cff;--ok:#22c55e;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:12px 20px;
         background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0;font-weight:650}
  .badge{font-size:11px;padding:3px 9px;border-radius:999px;
         background:rgba(91,140,255,.15);color:var(--accent);
         border:1px solid rgba(91,140,255,.35)}
  .spacer{flex:1}
  .peer{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;
        padding:2px 9px;border-radius:999px;border:1px solid var(--line);
        margin-left:6px;background:var(--panel2)}
  .dot{width:9px;height:9px;border-radius:50%}
  main{display:grid;grid-template-columns:1fr 300px;gap:14px;padding:14px 20px}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  #board{position:relative;height:520px;background:var(--panel);
         border:1px solid var(--line);border-radius:12px;overflow:hidden;
         background-image:radial-gradient(#2b303b 1px,transparent 1px);
         background-size:22px 22px}
  .node{position:absolute;min-width:120px;padding:10px 12px;border-radius:10px;
        background:var(--panel2);border:1px solid var(--accent);cursor:grab;
        font-size:12.5px;user-select:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .node b{display:block;font-size:12px;margin-bottom:2px}
  .rcursor{position:absolute;pointer-events:none;transition:all .12s ease-out}
  .rcursor .arrow{width:0;height:0;border-left:9px solid;border-bottom:14px solid
        transparent;border-right:6px solid transparent}
  .rcursor .tag{font-size:10.5px;padding:1px 6px;border-radius:6px;color:#fff;
        margin-top:2px;white-space:nowrap}
  aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:12px 14px;display:flex;flex-direction:column;gap:8px}
  aside h2{font-size:12px;margin:0;text-transform:uppercase;letter-spacing:.7px;
           color:var(--muted)}
  input,button{font:inherit;font-size:12.5px;padding:7px 9px;border-radius:8px;
        border:1px solid var(--line);background:var(--panel2);color:var(--fg)}
  button{cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  #comments{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}
  .cmt{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
       padding:6px 8px;font-size:12px}
  .cmt .who{color:var(--accent);font-weight:600;font-size:11px}
  .muted{color:var(--muted);font-size:11.5px}
</style>
</head>
<body>
<header>
  <h1>Katalir · Kolaborasi Real-Time</h1>
  <span class="badge" id="room">room: —</span>
  <span class="badge" id="status">menghubungkan…</span>
  <span class="spacer"></span>
  <span id="peers"></span>
</header>

<main>
  <div id="board"></div>
  <aside>
    <h2>Node</h2>
    <button class="primary" id="add">+ Tambah node</button>
    <div class="muted">Seret node untuk memindahkan. Posisi tersinkron lewat CRDT (Yjs).</div>
    <h2 style="margin-top:6px">Komentar</h2>
    <div id="comments"></div>
    <input id="cmt" placeholder="Tulis komentar…">
    <button id="send">Kirim</button>
  </aside>
</main>

<script type="importmap">
{"imports":{
  "yjs":"https://esm.sh/yjs@13",
  "y-websocket":"https://esm.sh/y-websocket@2?external=yjs"
}}
</script>
<script type="module">
import * as Y from 'yjs';
import { WebsocketProvider } from 'y-websocket';

const q = new URLSearchParams(location.search);
if (q.get('token')) { try { localStorage.setItem('katalir_token', q.get('token')); } catch(e){} }
const token = (() => { try { return localStorage.getItem('katalir_token') || ''; } catch(e){ return ''; } })();
const room = q.get('room') || 'demo';
const myName = q.get('name') || ('User-' + Math.floor(Math.random()*900+100));
const COLORS = ['#e11d48','#2563eb','#22c55e','#f59e0b','#8b5cf6','#06b6d4','#ef4444'];
const myColor = COLORS[Math.floor(Math.random()*COLORS.length)];

document.getElementById('room').textContent = 'room: ' + room;
const $ = (id) => document.getElementById(id);

const doc = new Y.Doc();
const nodes = doc.getMap('nodes');
const comments = doc.getArray('comments');

// y-websocket menghubungkan ke <serverUrl>/<room>?token=...
const wsBase = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/collab/ws';
const provider = new WebsocketProvider(wsBase, room, doc, { params: { token } });
const awareness = provider.awareness;
awareness.setLocalStateField('user', { name: myName, color: myColor });

provider.on('status', (e) => {
  const s = $('status');
  s.textContent = e.status === 'connected' ? 'terhubung' : 'terputus';
  s.style.color = e.status === 'connected' ? 'var(--ok)' : '#ef4444';
});
provider.on('sync', (isSynced) => {
  if (isSynced) { $('status').textContent = 'tersinkron'; $('status').style.color = 'var(--ok)'; }
});

// ---- render node ----
const board = $('board');
const els = new Map();
function renderNode(id) {
  let el = els.get(id);
  const data = nodes.get(id) || {};
  if (!el) {
    el = document.createElement('div');
    el.className = 'node';
    el.innerHTML = '<b></b><span></span>';
    board.appendChild(el);
    els.set(id, el);
    el.addEventListener('pointerdown', (ev) => {
      ev.preventDefault(); el.setPointerCapture(ev.pointerId);
      const sx = ev.clientX, sy = ev.clientY;
      const ox = (nodes.get(id)||{}).x || 0, oy = (nodes.get(id)||{}).y || 0;
      const move = (e) => {
        nodes.set(id, Object.assign({}, nodes.get(id), {
          x: Math.round(ox + e.clientX - sx), y: Math.round(oy + e.clientY - sy) }));
      };
      const up = () => { el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up); };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
    });
  }
  el.style.left = (data.x || 0) + 'px';
  el.style.top = (data.y || 0) + 'px';
  el.querySelector('b').textContent = data.label || id;
  el.querySelector('span').textContent = id;
}
nodes.observe((e) => { e.keysChanged.forEach(renderNode); });

// ---- remote cursors + peers ----
function renderPeers() {
  const states = awareness.getStates();
  const list = [];
  board.querySelectorAll('.rcursor').forEach(n => n.remove());
  states.forEach((st, cid) => {
    if (!st || !st.user) return;
    list.push(st.user);
    if (cid === awareness.clientID || !st.cursor) return;
    const c = document.createElement('div');
    c.className = 'rcursor';
    c.style.left = st.cursor.x + 'px';
    c.style.top = st.cursor.y + 'px';
    c.innerHTML = `<div class="arrow" style="border-left-color:${st.user.color}"></div>` +
      `<div class="tag" style="background:${st.user.color}">${st.user.name}</div>`;
    board.appendChild(c);
  });
  $('peers').innerHTML = list.map(u =>
    `<span class="peer"><span class="dot" style="background:${u.color}"></span>${u.name}</span>`).join('');
}
awareness.on('change', renderPeers);

// ---- komentar ----
function renderComments() {
  $('comments').innerHTML = comments.toArray().map(c =>
    `<div class="cmt"><div class="who">${c.user||'?'}</div>${c.text||''}</div>`).join('')
    || '<div class="muted">belum ada komentar</div>';
}
comments.observe(renderComments);

// ---- interaksi ----
let seq = 0;
$('add').onclick = () => {
  seq++;
  const id = 'n' + (Object.keys(nodes.toJSON()).length + 1) + '-' + Math.floor(Math.random()*900+100);
  nodes.set(id, { label: 'Node ' + id, x: 30 + Math.random()*420, y: 30 + Math.random()*380 });
};
$('send').onclick = () => {
  const t = $('cmt').value.trim(); if (!t) return;
  comments.push([{ user: myName, text: t, at: Date.now() }]);
  $('cmt').value = '';
};
board.addEventListener('pointermove', (e) => {
  const r = board.getBoundingClientRect();
  awareness.setLocalStateField('cursor', {
    x: Math.round(e.clientX - r.left), y: Math.round(e.clientY - r.top) });
});

// ---- ekspos untuk pengujian otomatis ----
window.__collab = { doc, nodes, comments, provider, awareness, myName, room };
</script>
</body>
</html>
