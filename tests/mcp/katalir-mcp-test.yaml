# Generated by `orchestra init`. Safe to edit: this file is yours now.
version: 1
name: "agentgateway-contract"
server:
  transport: http
  # Dapat diatur lewat env supaya suite ini tidak mengunci satu endpoint
  # sementara. Port 13001 = tunnel SSH ke agentgateway di VPS (port 3001
  # hanya listen di localhost VPS), lihat _mcp_tunnel_daemon.py.
  url: "{{env.MCP_GATEWAY_URL}}"
  auth:
    type: bearer
    token: "{{env.MCP_GW_KEY}}"
defaults:
  fail_on: breaking

steps:
  # The contract: tool names, schemas, descriptions. First run writes
  # the baseline; later runs fail when the surface drifts from it.
  - id: contract
    type: snapshot
    baseline: "baselines/katalir-mcp-test.surface.json"

  # ── Perilaku echo (sesuai brief Bagian 4.2) ───────────────────
  # Nama tool di gateway ber-prefix target: `everything_echo`.
  - id: echo_katalir
    type: tool_call
    tool: "everything_echo"
    input:
      message: "Katalir MCP Test"
  - id: echo_katalir_no_error
    type: assert
    from: "echo_katalir"
    check:
      op: no_error
  - id: echo_katalir_content
    type: assert
    from: "echo_katalir"
    check:
      op: jsonpath_exists
      path: "$.content[0].text"

  - id: "everything_get_env"
    type: tool_call
    tool: "everything_get-env"
    input: {}
  - id: "everything_get_env_check_0"
    type: assert
    from: "everything_get_env"
    check:
      op: no_error
  - id: "everything_get_env_check_1"
    type: assert
    from: "everything_get_env"
    check:
      op: jsonpath_len_gte
      path: "$.content"
      value: 1

  - id: "everything_get_tiny_image"
    type: tool_call
    tool: "everything_get-tiny-image"
    input: {}
  - id: "everything_get_tiny_image_check_0"
    type: assert
    from: "everything_get_tiny_image"
    check:
      op: no_error
  - id: "everything_get_tiny_image_check_1"
    type: assert
    from: "everything_get_tiny_image"
    check:
      op: jsonpath_len_gte
      path: "$.content"
      value: 1

